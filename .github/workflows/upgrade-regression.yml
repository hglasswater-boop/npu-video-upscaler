name: Published installer upgrade regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/upgrade_regression.py
      - tests/test_upgrade_regression.py
      - .github/workflows/upgrade-regression.yml
      - docs/releases-and-updates.md

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal updater/test requirements
        run: python -m pip install "packaging>=24,<27" "pytest>=8,<10" "numpy>=1.26,<3"
      - name: Offline safety and version transition tests
        run: python -m pytest -q tests/test_updates.py tests/test_upgrade_regression.py
      - name: Upgrade actual signed-by-hash published installers a1 to a2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m scripts.upgrade_regression
          if ($LASTEXITCODE -ne 0) { throw "Windows a1 -> a2 regression failed" }
