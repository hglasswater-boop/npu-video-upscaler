name: Windows installer and prerelease

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package, test and build tools
        run: python -m pip install -e ".[dev]"

      - name: Fetch and verify FFmpeg for A/V regression tests
        shell: pwsh
        run: |
          $base = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-essentials.zip"
          Invoke-WebRequest -Uri $base -OutFile $zip
          $expected = (Invoke-WebRequest -Uri "$base.sha256").Content.Trim().ToLowerInvariant()
          if ($expected.Length -ne 64 -or $expected -match "[^a-f0-9]") { throw "Invalid upstream FFmpeg checksum" }
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg archive checksum mismatch" }
          $directory = Join-Path $env:RUNNER_TEMP "ffmpeg-essentials"
          Expand-Archive -Path $zip -DestinationPath $directory
          $probe = Get-ChildItem -Path $directory -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          if (!$probe) { throw "FFprobe missing in verified archive" }
          $bin = $probe.Directory.FullName
          if (!(Test-Path (Join-Path $bin "ffmpeg.exe"))) { throw "FFmpeg missing in verified archive" }
          "$bin" >> $env:GITHUB_PATH
          "FFMPEG_VENDOR_BIN=$bin" >> $env:GITHUB_ENV
          "FFMPEG_VENDOR_ARCHIVE_SHA256=$actual" >> $env:GITHUB_ENV
          $env:PATH = "$bin;$env:PATH"
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
      - name: Unit and FFmpeg integration tests
        run: python -m pytest -q -rs

      - name: Resolve version from single source
        id: version
        shell: pwsh
        run: |
          $version = python -c "from npu_upscaler import __version__; print(__version__)"
          $metadata = python -c "import importlib.metadata; print(importlib.metadata.version('npu-video-upscaler'))"
          if ($version -ne $metadata) { throw "Version mismatch between source and wheel metadata" }
          "app_version=$version" >> $env:GITHUB_OUTPUT
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Package GUI as Windows x64 onedir executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --collect-all openvino --name NpuVideoUpscaler launcher.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller packaging failed" }
          if (!(Test-Path "dist/NpuVideoUpscaler/NpuVideoUpscaler.exe")) { throw "Packaged executable is missing" }

      - name: Stage verified FFmpeg binaries in application-private media-tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'dist/NpuVideoUpscaler/_internal/media-tools'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          foreach ($name in @('ffmpeg.exe', 'ffprobe.exe')) {
            $src = Join-Path $env:FFMPEG_VENDOR_BIN $name
            if (!(Test-Path $src)) { throw "Missing vendor executable: $src" }
            Copy-Item $src (Join-Path $dest $name)
          }
          $exe = Join-Path $dest 'ffmpeg.exe'
          $probe = Join-Path $dest 'ffprobe.exe'
          $encoders = & $exe -hide_banner -encoders 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $encoders -notmatch '\blibx264\b') {
            throw 'Bundled FFmpeg does not offer required libx264 encoder'
          }
          & $probe -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'Bundled ffprobe smoke failed' }
          & $exe -buildconf | Set-Content -Path (Join-Path $dest 'ffmpeg-buildconf.txt')
          @(
            'This build uses FFmpeg binaries from gyan.dev.'
            'Vendor: https://www.gyan.dev/ffmpeg/builds/'
            "Vendor archive SHA256: $env:FFMPEG_VENDOR_ARCHIVE_SHA256"
            'FFmpeg source: https://github.com/FFmpeg/FFmpeg/commit/946fcce07b'
            'License: GPLv3 (static release essentials build with libx264).'
            'Distribution requires complete corresponding source and license notices.'
            'See: https://ffmpeg.org/legal.html'
          ) | Set-Content -Encoding utf8 (Join-Path $dest 'FFMPEG-NOTICE.txt')
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/FFmpeg/FFmpeg/n9.0/COPYING.GPLv3' -OutFile (Join-Path $dest 'GPL-3.0.txt')
          if ((Get-Item (Join-Path $dest 'GPL-3.0.txt')).Length -lt 30000) {
            throw 'FFmpeg GPLv3 license text is missing'
          }

      - name: Verify media tools run without external FFmpeg on PATH
        shell: pwsh
        run: |
          $tools = (Resolve-Path 'dist/NpuVideoUpscaler/_internal/media-tools').Path
          $original = $env:PATH
          try {
            $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
            & (Join-Path $tools 'ffmpeg.exe') -version | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Private FFmpeg failed with sanitized PATH' }
            & (Join-Path $tools 'ffprobe.exe') -version | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Private ffprobe failed with sanitized PATH' }
          } finally {
            $env:PATH = $original
          }

      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/NpuVideoUpscaler/NpuVideoUpscaler.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged executable CLI smoke test failed: $($p.ExitCode)" }
          $p = Start-Process -FilePath $exe -ArgumentList "--check-media" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Bundled FFmpeg/ffprobe CLI smoke test failed: $($p.ExitCode)" }
          $env:NPU_UPSCALER_SMOKE_TEST = "1"
          $p = Start-Process -FilePath $exe -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged GUI launch smoke failed: $($p.ExitCode)" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build per-user Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 compiler not installed" }
          & $iscc "/DAppVersion=$env:APP_VERSION" "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }

      - name: Smoke test unattended install (CI only)
        shell: pwsh
        run: |
          $installer = "dist/installer/NpuVideoUpscaler-Setup-v$env:APP_VERSION-win-x64.exe"
          if (!(Test-Path $installer)) { throw "Installer is missing" }
          $p = Start-Process -FilePath (Resolve-Path $installer).Path -ArgumentList @("/VERYSILENT", "/NORESTART") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA "Programs/NpuVideoUpscaler/NpuVideoUpscaler.exe"
          if (!(Test-Path $installed)) { throw "Installed executable missing" }
          $p = Start-Process -FilePath $installed -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installed executable smoke failed: $($p.ExitCode)" }
          $oldpath = $env:PATH
          try {
            $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
            $p = Start-Process -FilePath $installed -ArgumentList "--check-media" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Installed media tools failed without external PATH FFmpeg" }
          } finally {
            $env:PATH = $oldpath
          }

      - name: Install offline model conversion dependencies
        run: python -m pip install -r scripts/model-build-requirements.txt

      - name: Fetch and hash-pin authors BSRGANx2 checkpoint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $weights = Join-Path $env:RUNNER_TEMP 'BSRGANx2.pth'
          Invoke-WebRequest -Uri 'https://github.com/cszn/KAIR/releases/download/v1.0/BSRGANx2.pth' -OutFile $weights
          $expected = '614f68bcafcf123a1ea51cc75ae5741640a8b1d49dd75757ad3ad531f772c736'
          $actual = (Get-FileHash $weights -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected -or (Get-Item $weights).Length -ne 66894171) { throw 'Unexpected BSRGANx2 checkpoint bytes' }
          "BSRGAN_WEIGHTS=$weights" >> $env:GITHUB_ENV

      - name: Prepare static OpenVINO INT8 model and Apache notice
        shell: pwsh
        run: |
          python -m scripts.build_bsrgan_ir --checkpoint $env:BSRGAN_WEIGHTS --sha256 614f68bcafcf123a1ea51cc75ae5741640a8b1d49dd75757ad3ad531f772c736 --output model-output
          if ($LASTEXITCODE -ne 0) { throw 'Model conversion failed' }
          Copy-Item third_party/BSRGAN-LICENSE.txt model-output/BSRGAN-LICENSE.txt
          if (!(Test-Path model-output/BSRGANx2.xml) -or !(Test-Path model-output/BSRGANx2.bin)) { throw 'Model incomplete' }

      - name: Prepare release files and SHA256 sums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/release -Force | Out-Null
          $installer = "NpuVideoUpscaler-Setup-v$env:APP_VERSION-win-x64.exe"
          $portable = "NpuVideoUpscaler-v$env:APP_VERSION-win-x64-portable.zip"
          Copy-Item "dist/installer/$installer" "dist/release/$installer"
          Compress-Archive -Path "dist/NpuVideoUpscaler" -DestinationPath "dist/release/$portable"
          $modelArchive = "BSRGANx2-OpenVINO-INT8.zip"
          Compress-Archive -Path "model-output/*" -DestinationPath "dist/release/$modelArchive"
          @($installer, $portable, $modelArchive) | ForEach-Object {
            $hash = (Get-FileHash "dist/release/$_" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$_"
          } | Set-Content -Encoding ascii "dist/release/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        # Public PR artifacts are downloadable distributions too: require GPL compliance.
        if: vars.FFMPEG_GPL_CORRESPONDING_SOURCE_READY == 'true'
        with:
          name: windows-alpha-${{ steps.version.outputs.app_version }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FFMPEG_GPL_CORRESPONDING_SOURCE_READY == 'true'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-alpha-${{ needs.package.outputs.version }}
          path: release-assets
      - name: Publish immutable versioned GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing release $tag is immutable; no new version, skipping publication."
            exit 0
          fi
          gh release create "$tag" release-assets/* \
            --title "$tag (experimental alpha)" \
            --notes-file .github/RELEASE_NOTES_ALPHA.md \
            --target "$GITHUB_SHA" \
            --prerelease
